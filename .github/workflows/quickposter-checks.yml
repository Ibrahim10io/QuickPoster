name: QUICKPOSTER checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  project-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check docs/app.js
          node --check docs/auth.js
          node --check scripts/check-project.mjs
      - name: Run QUICKPOSTER project checks
        run: node scripts/check-project.mjs


  visual-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture QUICKPOSTER desktop and mobile views
        run: |
          mkdir -p visual-preview
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const errors = [];
          for (const viewport of [
            { name: 'desktop', width: 1440, height: 1000 },
            { name: 'mobile', width: 390, height: 844 }
          ]) {
            const page = await browser.newPage({ viewport: { width: viewport.width, height: viewport.height }, deviceScaleFactor: 1 });
            page.on('pageerror', error => errors.push(viewport.name + ': ' + error.message));
            await page.goto('https://ibrahim10io.github.io/QuickPoster/?visual-check=' + Date.now() + '#nouvelle-affiche', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(5000);
            await page.screenshot({ path: 'visual-preview/' + viewport.name + '.png', fullPage: true });
            await page.close();
          }
          await browser.close();
          await import('node:fs').then(fs => fs.writeFileSync('visual-preview/page-errors.txt', errors.length ? errors.join('\n') : 'Aucune erreur JavaScript non gérée détectée.'));
          NODE
      - name: Upload visual preview
        uses: actions/upload-artifact@v4
        with:
          name: quickposter-visual-preview
          path: visual-preview/
          retention-days: 3

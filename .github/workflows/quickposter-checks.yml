name: QUICKPOSTER checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  project-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check docs/app.js
          node --check docs/auth.js
          node --check scripts/check-project.mjs
          node --check scripts/quickposter-e2e.mjs
      - name: Run QUICKPOSTER project checks
        run: node scripts/check-project.mjs


  visual-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright @axe-core/playwright pdf-lib pngjs
          npx playwright install --with-deps chromium firefox webkit
      - name: Capture QUICKPOSTER desktop and mobile views
        run: |
          mkdir -p visual-preview
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const fs = await import('node:fs');
          const { spawn } = await import('node:child_process');
          const server = spawn('python3', ['-m', 'http.server', '4173', '--directory', 'docs'], { stdio: 'ignore' });
          const browser = await chromium.launch({ headless: true });
          const errors = [];
          try {
            await new Promise(resolve => setTimeout(resolve, 1500));
            for (const viewport of [
              { name: 'desktop', width: 1440, height: 1000 },
              { name: 'mobile', width: 390, height: 844 }
            ]) {
              const page = await browser.newPage({ viewport: { width: viewport.width, height: viewport.height }, deviceScaleFactor: 1 });
              page.on('pageerror', error => errors.push(viewport.name + ': ' + error.message));
              await page.goto('http://127.0.0.1:4173/#nouvelle-affiche', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForTimeout(2500);
              const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth);
              if (overflow) errors.push(viewport.name + ': débordement horizontal détecté');
              await page.screenshot({ path: 'visual-preview/' + viewport.name + '.png', fullPage: true });
              if (viewport.width <= 760) {
                await page.locator('#mobile-menu-toggle').click();
              }
              await page.locator('[data-route="accueil"]:visible').click();
              await page.waitForTimeout(250);
              if (!(await page.locator('[data-view="accueil"]').isVisible())) errors.push(viewport.name + ': navigation accueil défaillante');

              // Verify hostile/corrupt saved data is rendered as inert text and normalized.
              const hostileTitle = '<img src=x onerror="window.__quickposterXss=true">';
              await page.evaluate((title) => localStorage.setItem('quickposter.creations.v1', JSON.stringify([{
                id: 'visual-hostile-test',
                title,
                subtitle: '<script>bad()</script>',
                texts: { businessName: title, businessType: 'Test', product: 'Produit' },
                template: '"><script>bad()</script>',
                colors: { background: 'url(javascript:alert(1))', accent: '#123456' },
                photo: { data: 'data:image/svg+xml,<svg onload=alert(1)>', left: 'NaN', top: -500, width: 900 },
                createdAt: new Date().toISOString()
              }])), hostileTitle);
              // Reload so the app re-reads the deliberately injected localStorage fixture.
              await page.reload({ waitUntil: 'domcontentloaded' });
              await page.goto('http://127.0.0.1:4173/#mes-creations', { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(500);
              if (await page.locator('.creation-card').count() !== 1) errors.push(viewport.name + ': données sauvegardées non affichées');
              if ((await page.locator('.creation-card-title').textContent()) !== hostileTitle) errors.push(viewport.name + ': texte utilisateur mal échappé');
              if (await page.evaluate(() => window.__quickposterXss === true)) errors.push(viewport.name + ': contenu utilisateur exécuté');
              const safePreview = await page.evaluate(() => {
                const preview = document.querySelector('.creation-preview');
                return {
                  className: preview?.className,
                  background: preview?.style.getPropertyValue('--creation-bg'),
                  images: preview?.querySelectorAll('img').length ?? -1
                };
              });
              if (safePreview.className !== 'creation-preview template-atelier' || safePreview.background !== '#ffffff' || safePreview.images !== 0) errors.push(viewport.name + ': normalisation des données sauvegardées défaillante');

              // Verify the complete local create/save/list flow without an account.
              await page.evaluate(() => localStorage.removeItem('quickposter.creations.v1'));
              await page.goto('http://127.0.0.1:4173/#nouvelle-affiche', { waitUntil: 'domcontentloaded' });
              await page.locator('#business-name').fill('Commerce test');
              await page.locator('#business-type').fill('Boutique');
              await page.locator('#product').fill('Produit test');
              await page.locator('#poster-form button[type="submit"]').click();
              await page.locator('#poster:not([hidden])').waitFor({ timeout: 10000 });
              await page.locator('#save-creation').click();
              await page.waitForFunction(() => JSON.parse(localStorage.getItem('quickposter.creations.v1') || '[]').length === 1, null, { timeout: 10000 });
              await page.goto('http://127.0.0.1:4173/#mes-creations', { waitUntil: 'domcontentloaded' });
              if (await page.locator('.creation-card-title').textContent() !== 'Commerce test') errors.push(viewport.name + ': sauvegarde locale impossible');

              await page.screenshot({ path: 'visual-preview/' + viewport.name + '-accueil.png', fullPage: true });
              await page.close();
            }
          } finally {
            await browser.close();
            server.kill();
          }
          fs.writeFileSync('visual-preview/page-errors.txt', errors.length ? errors.join('\n') : 'Aucune erreur JavaScript non gérée, aucun débordement horizontal, navigation accueil OK.');
          NODE
      - name: Run full browser, accessibility and export audit
        run: node scripts/quickposter-e2e.mjs
      - name: Upload visual preview
        uses: actions/upload-artifact@v4
        with:
          name: quickposter-visual-preview
          path: visual-preview/
          retention-days: 3